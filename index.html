<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩工具 - 在线压缩 & 调整尺寸</title>
    <meta name="description" content="免费在线图片压缩工具，支持 JPEG/PNG/WebP 格式，浏览器端处理，图片不上传服务器，隐私安全。">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1 class="logo">🖼️ 图片压缩工具</h1>
            <p class="tagline">浏览器端处理 · 图片不上传 · 隐私安全</p>
        </div>
    </header>

    <main class="container">
        <!-- 上传区域 -->
        <section class="upload-section" id="uploadSection">
            <div class="dropzone" id="dropzone">
                <div class="dropzone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" width="64" height="64">
                        <path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                    </svg>
                    <p class="dropzone-title">点击或拖拽图片到此处</p>
                    <p class="dropzone-hint">支持 JPEG、PNG、WebP · 可批量处理</p>
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
                </div>
            </div>
        </section>

        <!-- 设置面板 -->
        <section class="settings-panel" id="settingsPanel" style="display:none;">
            <h2 class="section-title">压缩设置</h2>
            <div class="settings-grid">
                <div class="setting-item">
                    <label for="qualitySlider">压缩质量</label>
                    <div class="slider-row">
                        <input type="range" id="qualitySlider" min="10" max="100" value="80">
                        <span class="slider-value" id="qualityValue">80%</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label for="formatSelect">输出格式</label>
                    <select id="formatSelect">
                        <option value="auto">自动（保持原格式）</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WebP（更小）</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="resizeToggle">调整尺寸</label>
                    <label class="switch">
                        <input type="checkbox" id="resizeToggle">
                        <span class="switch-slider"></span>
                    </label>
                </div>
                <div class="setting-item resize-controls" id="resizeControls" style="display:none;">
                    <label for="maxWidth">最大宽度 (px)</label>
                    <input type="number" id="maxWidth" placeholder="如 1920" min="1">
                    <label for="maxHeight" class="mt-8">最大高度 (px)</label>
                    <input type="number" id="maxHeight" placeholder="留空保持比例" min="1">
                </div>
            </div>
            <div class="settings-actions">
                <button class="btn btn-primary" id="compressBtn">开始压缩</button>
                <button class="btn btn-secondary" id="resetBtn">重新选择</button>
            </div>
        </section>

        <!-- 结果区域 -->
        <section class="results-section" id="resultsSection" style="display:none;">
            <div class="results-header">
                <h2 class="section-title">压缩结果</h2>
                <button class="btn btn-primary btn-sm" id="downloadAllBtn">全部下载</button>
            </div>
            <div class="results-summary" id="resultsSummary"></div>
            <div class="results-list" id="resultsList"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>所有图片处理均在浏览器本地完成，不会上传到任何服务器。</p>
        </div>
    </footer>

    <script src="js/compressor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
